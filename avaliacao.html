<script>

/* A mesma avaliação é usada pelo aplicativo e pelo formulário dentro do treino.
   GitHub Pages do mesmo usuário compartilha a origem e o localStorage. */
window.AvaliacaoTreinoSync = (function () {
  var key = 'avaliacao_fisica_alunos';
  function read(k) {
    var value = JSON.parse(localStorage.getItem(k) || '[]');
    if (!Array.isArray(value)) throw Error('Cadastro inválido. Importe um backup válido antes de continuar.');
    return value;
  }
  function normal(name) { return String(name || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim().replace(/\s+/g, ' ').toLowerCase(); }
  function isLinked(record, studentId) {
    return !!studentId && (record.treinoStudentId === studentId || (Array.isArray(record.treinoStudentIds) && record.treinoStudentIds.includes(studentId)));
  }
  function link(record, studentId) {
    var ids = Array.isArray(record.treinoStudentIds) ? record.treinoStudentIds.slice() : [];
    if (record.treinoStudentId) ids.push(record.treinoStudentId);
    ids.push(studentId);
    record.treinoStudentIds = Array.from(new Set(ids));
    if (!record.treinoStudentId) record.treinoStudentId = ids[0];
  }
  function find(records, student) {
    var linked = records.filter(function (a) { return isLinked(a, student.student_id); });
    if (linked.length === 1) return linked[0];
    if (linked.length > 1) throw Error('Há mais de um cadastro vinculado a este aluno. Confira os cadastros na Avaliação.');
    var matches = records.filter(function (a) { return normal(a.nome) === normal(student.nome); });
    if (matches.length > 1) throw Error('Há alunos com o mesmo nome na Avaliação. Diferencie os nomes antes de vincular.');
    return matches[0] || null;
  }
  function number(value) {
    var m = String(value || '').replace(',', '.').match(/\d+(?:\.\d+)?/);
    return m ? m[0] : '';
  }
  function fromFicha(student, record, ficha, previous) {
    var map = { idade:'idade', altura:'altura', dataNasc:'nasc', nomeCompleto:'nome', whats:'whatsapp', email:'email' };
    Object.keys(map).forEach(function (field) {
      if (previous && ficha[field] === previous[field]) return;
      var value = ficha[field] || '';
      if (field === 'nomeCompleto' && !value) return;
      if (field === 'altura') { value = number(value); if (Number(value) > 3) value = String(Number(value) / 100); }
      if (field === 'idade') value = number(value);
      record[map[field]] = value;
    });
    if (!previous || ficha.peso !== previous.peso) {
      var latest = (record.avaliacoes || []).slice(-1)[0];
      if (latest) latest.peso = number(ficha.peso);
      else record.pesoIni = number(ficha.peso);
    }
  }
  function toFicha(student, record) {
    var guias = student.infoGuias || [];
    var ficha = guias.find(function (g) { return g.id === student.avaliacaoFichaId; }) || guias[0];
    if (!ficha) { ficha = Object.assign({id:'1', titulo:'Ficha 1'}, student.infoRelevante || {}); guias.push(ficha); }
    student.infoGuias = guias;
    student.avaliacaoFichaId = ficha.id;
    var latest = (record.avaliacoes || []).slice(-1)[0];
    Object.assign(ficha, {idade:record.idade || '', altura:record.altura || '', dataNasc:record.nasc || '', nomeCompleto:record.nome || '', whats:record.whatsapp || '', email:record.email || '', peso:latest ? (latest.peso || '') : (record.pesoIni || '')});
    student.infoRelevante = Object.assign({}, ficha);
    student.whatsapp = record.whatsapp || '';
    student.avaliacaoId = record.id;
    return ficha;
  }
  function syncTraining(records) {
    var students = read('treinoAlunos'), changed = false;
    students.forEach(function (student) {
      if (!student.student_id) return;
      var record = records.find(function (a) { return isLinked(a, student.student_id); });
      if (!record) return;
      var before = JSON.stringify(student);
      toFicha(student, record);
      if (before !== JSON.stringify(student)) changed = true;
    });
    if (changed) localStorage.setItem('treinoAlunos', JSON.stringify(students));
  }
  return {key:key, read:read, find:find, isLinked:isLinked, link:link, fromFicha:fromFicha, toFicha:toFicha, syncTraining:syncTraining};
})();

</script>

<script>
/* SCROLL AUTOMÁTICO PARA O CAMPO ATIVO (iPhone friendly) */
(function(){
  let scrollTimeout = null;

  function scrollCampoParaVisivel(el){
    if(!el) return;
    // Espera o teclado abrir/animar antes de calcular posições
    clearTimeout(scrollTimeout);
    scrollTimeout = setTimeout(function(){
      const rect = el.getBoundingClientRect();
      const viewportH = window.visualViewport ? window.visualViewport.height : window.innerHeight;
      const margemSuperior = 90;  // espaço para não ficar colado no topo
      const margemInferior = 40;  // espaço para não ficar colado no teclado

      // Se o campo está abaixo da área visível (considerando teclado)
      if(rect.bottom > viewportH - margemInferior){
        const delta = rect.bottom - (viewportH - margemInferior);
        window.scrollBy({top: delta, behavior: 'smooth'});
      }
      // Se o campo está acima da área visível
      else if(rect.top < margemSuperior){
        const delta = rect.top - margemSuperior;
        window.scrollBy({top: delta, behavior: 'smooth'});
      }
    }, 300);
  }

  document.addEventListener('focusin', function(e){
    const tag = e.target.tagName;
    if(tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT'){
      scrollCampoParaVisivel(e.target);
    }
  }, true);

  // Reagir também quando o teclado muda o tamanho do viewport (iOS)
  if(window.visualViewport){
    window.visualViewport.addEventListener('resize', function(){
      const ativo = document.activeElement;
      if(ativo && (ativo.tagName === 'INPUT' || ativo.tagName === 'TEXTAREA' || ativo.tagName === 'SELECT')){
        scrollCampoParaVisivel(ativo);
      }
    });
  }
})();

/* BOTÃO SUBIR AO TOPO */

document.getElementById('btnTopo').addEventListener('click', function() {

/* ESTADO GLOBAL */
let alunos = [];
let alunoAtivoId = null;
let ultimoEstado = null;
let timeoutDobras = null;
let currentBusca = '';
let currentOrdem = 'nome';

/* UTILITÁRIOS */
function escapeHtml(str){
  if(!str) return '';
  return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function pf(v){
  if(v===undefined||v===null||v==='') return NaN;
  return parseFloat(String(v).replace(',','.'));
}

function formatDelta(atual, anterior) {
  if(anterior === undefined || anterior === null || anterior === '' || atual === undefined || atual === null || atual === '') return '';
  const a = pf(atual);
  const b = pf(anterior);
  if(isNaN(a) || isNaN(b)) return '';
  const diff = a - b;
  if(Math.abs(diff) < 0.01) return '';
  if(diff > 0) return ` (+${diff.toFixed(1).replace('.',',')})`;
  if(diff < 0) return ` (${diff.toFixed(1).replace('.',',')})`;
  return '';
}

function formatDeltaCoxaBiceps(atual, anterior) {
  if(!atual || !anterior) return '';
  const partesAtual = atual.split('/');
  const partesAnterior = anterior.split('/');
  if(partesAtual.length !== 2 || partesAnterior.length !== 2) return '';
  const delta1 = formatDelta(partesAtual[0].trim(), partesAnterior[0].trim());
  const delta2 = formatDelta(partesAtual[1].trim(), partesAnterior[1].trim());
  if(!delta1 && !delta2) return '';
  return `${delta1}${delta2}`;
}

function formatarBicepsCoxa(input){
  let valor = input.value.trim();
  if(valor.includes('/')) return;
  let partes = valor.split(/\s+/);
  if(partes.length === 2){
    input.value = `${partes[0]} / ${partes[1]}`;
    return true;
  }
  return false;
}

function formatarDataAuto(input){
  let valor = input.value.replace(/\D/g,'');
  if(valor.length === 8){
    let dia=valor.substring(0,2), mes=valor.substring(2,4), ano=valor.substring(4,8);
    if(parseInt(dia)<=31&&parseInt(mes)<=12&&parseInt(ano)>1900&&parseInt(ano)<2100){
      input.value=`${dia}/${mes}/${ano}`;
      return true;
    }
  }
  return false;
}

function formatarAltura(input) {
  let valor = input.value.replace(/\D/g, '');
  if(valor.length === 3) {
    let metros = valor.substring(0,1);
    let centimetros = valor.substring(1,3);
    input.value = `${metros},${centimetros}`;
    return true;
  }
  if(valor.length === 2) {
    input.value = `0,${valor}`;
    return true;
  }
  return false;
}

function calcularIdade(dataNasc){
  if(!dataNasc||dataNasc.length!==10) return '';
  const partes=dataNasc.split('/');
  if(partes.length!==3) return '';
  const dia=parseInt(partes[0]),mes=parseInt(partes[1])-1,ano=parseInt(partes[2]);
  if(isNaN(dia)||isNaN(mes)||isNaN(ano)) return '';
  const nasc=new Date(ano,mes,dia), hoje=new Date();
  let idade=hoje.getFullYear()-nasc.getFullYear();
  if(hoje.getMonth()<nasc.getMonth()||(hoje.getMonth()===nasc.getMonth()&&hoje.getDate()<nasc.getDate())) idade--;
  return (idade>0&&idade<120)?idade:'';
}

function calcularIdadeMetabolica(sexo,idade,gordura){
  const g=pf(gordura);
  if(isNaN(g)||g<=0) return '';
  const idadeReal = pf(idade)||30;
  // Ponto médio da faixa "saudável" de % gordura por sexo (referência interna do app)
  const idealMid = sexo==='F' ? 27 : 15;
  const k = 0.7; // quanto cada ponto percentual acima/abaixo do ideal pesa em "anos"
  let diff = (g-idealMid)*k;
  diff = Math.max(-25, Math.min(25, diff));
  const idadeMet = Math.round(idadeReal + diff);
  return Math.max(16, Math.min(85, idadeMet));
}

function calcularTMB(sexo,idade,peso,altura){
  if(isNaN(peso)||isNaN(altura)||isNaN(idade)||idade<=0||peso<=0||altura<=0) return '';
  if(sexo==='M') return Math.round(66.47+(13.75*peso)+(5.003*(altura*100))-(6.755*idade));
  return Math.round(655.1+(9.563*peso)+(1.85*(altura*100))-(4.676*idade));
}

function calcularAMB(biceps,triceps){
  // Fórmula de Frisancho: AMB = (Circunferência - π × Dobra_tríceps_cm)² / (4π)
  const b=parseFloat(String(biceps).replace(',','.')), t=parseFloat(String(triceps).replace(',','.'));
  if(isNaN(b)||isNaN(t)||b<=0) return '';
  const tricepsCm = t/10; // dobra vem em mm, converte pra cm
  return (Math.pow(b - (Math.PI*tricepsCm), 2) / (4*Math.PI)).toFixed(2);
}

function calcularAGB(biceps,triceps){
  // AGB = Área total do braço - AMB
  const b=parseFloat(String(biceps).replace(',','.')), t=parseFloat(String(triceps).replace(',','.'));
  if(isNaN(b)||isNaN(t)||b<=0) return '';
  const areaTotal = Math.pow(b,2) / (4*Math.PI);
  const amb = parseFloat(calcularAMB(biceps,triceps));
  if(isNaN(amb)) return '';
  return (areaTotal - amb).toFixed(2);
}

function comprimirImagem(file, maxWidth = 800, maxHeight = 800, qualidade = 0.7) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = function(e) {
      const img = new Image();
      img.onload = function() {
        let width = img.width;
        let height = img.height;
        if (width > height) {
          if (width > maxWidth) { height = (height * maxWidth) / width; width = maxWidth; }
        } else {
          if (height > maxHeight) { width = (width * maxHeight) / height; height = maxHeight; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', qualidade));
      };
      img.onerror = () => reject(new Error('Erro ao carregar imagem'));
      img.src = e.target.result;
    };
    reader.onerror = () => reject(new Error('Erro ao ler arquivo'));
    reader.readAsDataURL(file);
  });
}

/* RENOVAÇÃO DE AVALIAÇÃO */
function parseDataBR(str){
  if(!str||str.length!==10) return null;
  const p=str.split('/');
  if(p.length!==3) return null;
  const d=new Date(parseInt(p[2]),parseInt(p[1])-1,parseInt(p[0]));
  return isNaN(d.getTime())?null:d;
}
function formatarDataBR(date){
  return `${String(date.getDate()).padStart(2,'0')}/${String(date.getMonth()+1).padStart(2,'0')}/${date.getFullYear()}`;
}
function isoFromBR(dataBR){
  const d=parseDataBR(dataBR);
  if(!d) return '';
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function brFromISO(iso){
  if(!iso) return '';
  const [ano,mes,dia]=iso.split('-');
  if(!ano||!mes||!dia) return '';
  return `${dia}/${mes}/${ano}`;
}
function calcularProximaRenovacao(aluno){
  if(!aluno.renovacaoDias) return null; // não configurado = não acompanha
  if(aluno.renovacaoDataManual){
    const dManual=parseDataBR(aluno.renovacaoDataManual);
    if(dManual) return dManual;
  }
  const ultimaData=getUltimaDataAvaliacao(aluno);
  if(!ultimaData) return null;
  const dataBase=parseDataBR(ultimaData);
  if(!dataBase) return null;
  const dias=parseInt(aluno.renovacaoDias);
  const prox=new Date(dataBase);
  prox.setDate(prox.getDate()+dias);
  return prox;
}
function getStatusRenovacao(aluno){
  const prox=calcularProximaRenovacao(aluno);
  if(!prox) return null;
  const hoje=new Date(); hoje.setHours(0,0,0,0);
  const proxZero=new Date(prox); proxZero.setHours(0,0,0,0);
  const diffDias=Math.round((proxZero-hoje)/(1000*60*60*24));
  let texto, classe;
  if(diffDias<0){ texto=`Vencida há ${Math.abs(diffDias)}d`; classe='vencida'; }
  else if(diffDias<=7){ texto=diffDias===0?'Vence hoje':`Vence em ${diffDias}d`; classe='proxima'; }
  else { texto=`Renova ${formatarDataBR(prox)}`; classe='ok'; }
  return {texto,classe,diffDias,data:prox};
}

/* PAGAMENTO (data exata digitada por parcela, individual por aluno — o professor atualiza
   manualmente quando recebe, podendo inclusive jogar a data lá na frente se o aluno pagou adiantado) */
/* Pega o dia-do-mês da data escolhida no calendário e calcula a próxima ocorrência (recorrência
   mensal automática). Depois de 5 dias de atraso, considera pago e já pula pro mês seguinte —
   assim não fica "devendo" pra sempre. Pra parar de acompanhar de vez, é só limpar a data (✕). */
function getProximaOcorrenciaMensal(dataBR){
  const base=parseDataBR(dataBR);
  if(!base) return null;
  const dia=base.getDate();
  const hoje=new Date(); hoje.setHours(0,0,0,0);
  const ano=hoje.getFullYear(), mes=hoje.getMonth();
  function dataDoMes(a,m,d){
    const ultimoDia=new Date(a,m+1,0).getDate();
    return new Date(a,m,Math.min(d,ultimoDia));
  }
  let candidato=dataDoMes(ano,mes,dia);
  let diff=Math.round((candidato-hoje)/(1000*60*60*24));
  if(diff<-5){
    candidato=dataDoMes(ano,mes+1,dia);
    diff=Math.round((candidato-hoje)/(1000*60*60*24));
  }
  return {data:candidato,diffDias:diff};
}

function getStatusPagamentos(aluno){
  const parcelas=[];
  if(aluno.pagamentoData1) parcelas.push({label:aluno.pagamentoTipo==='2x'?'Parcela 1':'Mensalidade',dataStr:aluno.pagamentoData1});
  if(aluno.pagamentoTipo==='2x' && aluno.pagamentoData2) parcelas.push({label:'Parcela 2',dataStr:aluno.pagamentoData2});
  return parcelas.map(p=>{
    const oc=getProximaOcorrenciaMensal(p.dataStr);
    if(!oc) return null;
    const {data,diffDias}=oc;
    let texto,classe;
    if(diffDias<0){ texto=`${p.label}: venceu há ${Math.abs(diffDias)}d`; classe='vencida'; }
    else if(diffDias<=3){ texto=`${p.label}: ${diffDias===0?'vence hoje':`vence em ${diffDias}d`}`; classe='proxima'; }
    else { texto=`${p.label}: dia ${data.getDate()}`; classe='ok'; }
    return {label:p.label,texto,classe,diffDias,data};
  }).filter(Boolean);
}

/* Junta pendências de renovação de avaliação + pagamento de um aluno, só o que é vencido/próximo */
function getPendenciasAluno(aluno){
  const pend=[];
  const stRenov=getStatusRenovacao(aluno);
  if(stRenov && stRenov.diffDias<=3) pend.push({tipo:'📋 Avaliação',texto:stRenov.texto,classe:stRenov.classe,diffDias:stRenov.diffDias});
  getStatusPagamentos(aluno).forEach(p=>{
    if(p.diffDias<=3) pend.push({tipo:'💰 '+p.label,texto:p.texto.split(': ')[1]||p.texto,classe:p.classe,diffDias:p.diffDias});
  });
  return pend;
}

function apagarAluno(id){
  if(confirm('Tem certeza que deseja apagar este aluno?')){
    backupEstado();
    alunos=alunos.filter(a=>a.id!==id);
    if(alunoAtivoId===id) alunoAtivoId=null;
    salvarDados(); filtrarAlunos();
    notifMsg('🗑️ Aluno removido!');
  }
}

function renomearAluno(id){
  const aluno=alunos.find(a=>a.id===id);
  if(aluno){
    const novoNome=prompt('Digite o novo nome do aluno:',aluno.nome);
    if(novoNome&&novoNome.trim()){
      backupEstado();
      aluno.nome=novoNome.trim(); salvarDados(); filtrarAlunos();
      notifMsg('✏️ Nome alterado!');
    }
  }
}

function selecionarAluno(id){
  alunoAtivoId=(alunoAtivoId===id)?null:id;
  filtrarAlunos();
}

function atualizarAluno(id,campo,valor){
  const aluno=alunos.find(a=>a.id===id);
  if(!aluno) return;
  backupEstado();
  aluno[campo]=valor;
  if(campo==='nasc'){
    const idadeCalc=calcularIdade(valor);
    if(idadeCalc){
      aluno.idade=idadeCalc;
      const el=document.getElementById(`idade-${id}`);
      if(el) el.value=idadeCalc;
    }
  }
  if (['altura','idade','nasc','sexo'].includes(campo)) (aluno.avaliacoes || []).forEach(av => calcularIMCeDobras(aluno, av.id));
  salvarDados();
  if(campo!=='nasc') filtrarAlunos();
}

/* AVALIAÇÕES */
function adicionarAvaliacao(alunoId){
  backupEstado();
  const aluno=alunos.find(a=>a.id===alunoId);
  if(!aluno) return;
  if(!aluno.avaliacoes) aluno.avaliacoes=[];
  const protocoloAnterior = aluno.avaliacoes.length ? (aluno.avaliacoes[aluno.avaliacoes.length-1].protocolo || 'jp7') : 'jp7';
  const novaAvaliacao = {
    id:Date.now(),
    data:new Date().toLocaleDateString('pt-BR'),
    protocolo:protocoloAnterior,
    peso:'',imc:'',gordura:'',visceral:'',massamuscular:'',proteina:'',agua:'',tmb:'',
    peitoral:'',biceps:'',barriga:'',cintura:'',quadril:'',coxa:'',
    triceps:'',axilar:'',torax:'',abdominal:'',suprailiaca:'',subescapular:'',pregaCoxa:'',panturrilha:'',
    resumo:'',motivo:'',fotoF:null,fotoL:null,fotoD:null,_dobras:null
  };
  aluno.avaliacoes.push(novaAvaliacao);
  salvarDados();
  filtrarAlunos();
  // Abrir a nova avaliação automaticamente
  setTimeout(() => {
    const newAvEl = document.getElementById(`av-item-${novaAvaliacao.id}`);
    if(newAvEl){
      newAvEl.classList.add('expanded');
      newAvEl.scrollIntoView({behavior:'smooth', block:'start'});
    }
  }, 100);
  notifMsg('📋 Avaliação adicionada!');
}

function removerAvaliacao(alunoId,avId){
  const aluno=alunos.find(a=>a.id===alunoId);
  if(!aluno||aluno.avaliacoes.length<=1){ notifMsg('⚠️ Mantenha ao menos uma avaliação.'); return; }
  if(!confirm('Remover avaliação?')) return;
  backupEstado();
  aluno.avaliacoes=aluno.avaliacoes.filter(a=>a.id!==avId);
  salvarDados();
  filtrarAlunos();
  notifMsg('🗑️ Avaliação removida!');
}

function toggleAvaliacao(avId, event){
  if(event) event.stopPropagation();
  const el = document.getElementById(`av-item-${avId}`);
  if(el){
    el.classList.toggle('expanded');
  }
}

function syncAvaliacao(alunoId,avId,campo,valor){
  const aluno=alunos.find(a=>a.id===alunoId);
  if(!aluno) return;
  const av=aluno.avaliacoes.find(a=>a.id===avId);
  if(!av) return;
  av[campo]=valor;
  calcularIMCeDobras(aluno,avId);
  salvarDados();
  if(timeoutDobras) clearTimeout(timeoutDobras);
  timeoutDobras=setTimeout(()=>{
    calcularIMCeDobras(aluno,avId);
    salvarDados();
    atualizarCamposCalculados(aluno, avId);
    // Atualizar resumo no header
    const headerResumo = document.getElementById(`av-resumo-${avId}`);
    if(headerResumo) headerResumo.innerText = getResumoAvaliacao(av) ? ` — ${getResumoAvaliacao(av)}` : '';
  },500);
}

/* METADADOS DOS PROTOCOLOS DE DOBRAS CUTÂNEAS */
const PROTOCOLOS_DOBRAS = {
  pollock3:{
    nome:'Jackson-Pollock (3 Dobras)',
    nomeCurto:'3 Dobras',
    campos:(sexo)=> sexo==='F' ? ['triceps','suprailiaca','pregaCoxa'] : ['torax','abdominal','pregaCoxa']
  },
  yuhasz6:{
    nome:'Yuhasz (6 Dobras)',
    nomeCurto:'6 Dobras',
    campos:()=>['triceps','torax','subescapular','suprailiaca','abdominal','pregaCoxa']
  },
  jp7:{
    nome:'Jackson-Pollock (7 Dobras)',
    nomeCurto:'7 Dobras',
    campos:()=>['triceps','axilar','torax','abdominal','suprailiaca','subescapular','pregaCoxa']
  }
};
function getProtocoloDef(protocolo){
  return PROTOCOLOS_DOBRAS[protocolo] || PROTOCOLOS_DOBRAS.jp7;
}
const LABELS_DOBRAS = {
  triceps:'Tríceps', axilar:'Axilar Média', torax:'Tórax', abdominal:'Abdominal',
  suprailiaca:'Suprailíaca', subescapular:'Subescapular', pregaCoxa:'Coxa', panturrilha:'Panturrilha Medial'
};

function calcularIMCeDobras(aluno,avId){
  const av=aluno.avaliacoes.find(a=>a.id===avId);
  if(!av) return;
  const altura=pf(aluno.altura), peso=pf(av.peso);
  av.imc = !isNaN(altura)&&!isNaN(peso)&&altura>0 ? (peso/(altura*altura)).toFixed(1) : '';
  const idade=pf(aluno.idade);
  av.tmb=calcularTMB(aluno.sexo,idade,peso,altura);
  // fallback: idade metabólica pelo % gordura manual (balança) — sobrescrita abaixo se as dobras forem calculadas
  av.idadeMetabolica = av.gordura ? calcularIdadeMetabolica(aluno.sexo, aluno.idade, av.gordura) : '';

  // protocolos antigos (ex.: Petroski 4 dobras, removido) caem automaticamente no padrão de 7 dobras
  if(!PROTOCOLOS_DOBRAS[av.protocolo]) av.protocolo='jp7';
  const protocolo = av.protocolo || 'jp7';
  const def = getProtocoloDef(protocolo);
  const campos = def.campos(aluno.sexo);
  const vals = campos.map(k=>pf(av[k]));
  if(vals.some(isNaN) || vals.every(v=>v===0)){ av._dobras=null; return; }
  const soma=vals.reduce((a,b)=>a+b,0);

  let dens=null, pctG;
  if(protocolo==='pollock3'){
    if(aluno.sexo==='F'){
      // Jackson, Pollock & Ward (1980) - mulheres: tríceps + suprailíaca + coxa
      dens = 1.0994921 - (0.0009929*soma) + (0.0000023*(soma*soma)) - (0.0001392*(idade||30));
    } else {
      // Jackson & Pollock (1978) - homens: peitoral + abdominal + coxa
      dens = 1.10938 - (0.0008267*soma) + (0.0000016*(soma*soma)) - (0.0002574*(idade||30));
    }
    pctG=Math.max(3,Math.min(50,(495/dens)-450));
  } else if(protocolo==='yuhasz6'){
    pctG = aluno.sexo==='F' ? (4.56+0.143*soma) : (3.64+0.097*soma);
    pctG=Math.max(3,Math.min(50,pctG));
  } else {
    dens = aluno.sexo === 'F'
      ? 1.097 - (0.00046971*soma) + (0.00000056*soma*soma) - (0.00012828*(idade||30))
      : 1.112 - (0.00043499*soma) + (0.00000055*soma*soma) - (0.00028826*(idade||30));
    pctG=Math.max(5,Math.min(50,((4.95/dens)-4.5)*100));
  }
  const pesoNum=pf(av.peso);
  const mG=(pctG/100)*pesoNum, mM=pesoNum-mG;
  const cintura=pf(av.cintura), quadril=pf(av.quadril);
  const rcq=(cintura&&quadril)?(cintura/quadril).toFixed(2):'—';
  av._dobras={soma,dens,pctG,mG,mM,rcq,protocolo};
  if(!av.agua) av.agua=(mM*0.73).toFixed(1);
  const gorduraRef = av.gordura || pctG.toFixed(1);
  av.idadeMetabolica = calcularIdadeMetabolica(aluno.sexo, aluno.idade, gorduraRef);
}

const LABELS_DOBRAS_EXTRA = {pregaCoxa:'Coxa (prega)'};
function renderizarCamposDobras(aluno, av){
  const campos = getProtocoloDef(av.protocolo).campos(aluno.sexo);
  return campos.map(k=>{
    const label = LABELS_DOBRAS_EXTRA[k] || LABELS_DOBRAS[k];
    return `<div class="field"><label>${label}</label><input type="text" value="${escapeHtml(av[k]||'')}" onchange="syncAvaliacao(${aluno.id},${av.id},'${k}',this.value)"></div>`;
  }).join('');
}

function trocarProtocoloDobras(alunoId, avId, valor){
  backupEstado();
  const aluno=alunos.find(a=>a.id===alunoId);
  if(!aluno) return;
  const av=aluno.avaliacoes.find(a=>a.id===avId);
  if(!av) return;
  av.protocolo=valor;
  calcularIMCeDobras(aluno,avId);
  salvarDados();
  filtrarAlunos();
  setTimeout(()=>{
    const el=document.getElementById(`av-item-${avId}`);
    if(el) el.classList.add('expanded');
  },100);
}

function atualizarCamposCalculados(aluno, avId){
  const av=aluno.avaliacoes.find(a=>a.id===avId);
  if(!av) return;
  const aId=aluno.id;
  const imcEl=document.getElementById(`imc-${aId}-${avId}`);
  if(imcEl){ imcEl.value=av.imc||''; }
  const tmbEl=document.getElementById(`tmb-${aId}-${avId}`);
  if(tmbEl){ tmbEl.value=av.tmb||''; }
  const aguaEl=document.getElementById(`agua-${aId}-${avId}`);
  if(aguaEl && av.agua) { aguaEl.value=av.agua; }
  const gorduraRef = av.gordura || (av._dobras ? av._dobras.pctG.toFixed(1) : '');
  av.idadeMetabolica = calcularIdadeMetabolica(aluno.sexo, aluno.idade, gorduraRef);
  const idadeMetEl=document.getElementById(`idademet-${aId}-${avId}`);
  if(idadeMetEl){ idadeMetEl.value=av.idadeMetabolica||''; }
  const previewEl=document.getElementById(`dobras-preview-${aId}-${avId}`);
  if(previewEl){ previewEl.innerHTML=renderizarPreviewDobras(av,aluno); }
  const badges=[{id:`peso-badge-${aId}-${avId}`,nome:'Peso',valor:av.peso},
                {id:`imc-badge-${aId}-${avId}`,nome:'IMC',valor:av.imc},
                {id:`gordura-badge-${aId}-${avId}`,nome:'% Gordura',valor:av.gordura},
                {id:`visceral-badge-${aId}-${avId}`,nome:'Gordura Visceral',valor:av.visceral},
                {id:`massa-badge-${aId}-${avId}`,nome:'Massa Muscular',valor:av.massamuscular},
                {id:`proteina-badge-${aId}-${avId}`,nome:'% Proteína',valor:av.proteina},
                {id:`agua-badge-${aId}-${avId}`,nome:'% Água',valor:av.agua},
                {id:`tmb-badge-${aId}-${avId}`,nome:'TMB',valor:av.tmb},
                {id:`idademet-badge-${aId}-${avId}`,nome:'Idade Metabólica',valor:av.idadeMetabolica}];
  badges.forEach(b=>{
    const el=document.getElementById(b.id);
    if(el){
      const cls=getClassificacaoTexto(b.nome,b.valor,aluno.sexo);
      el.className=`badge ${cls.classe}`;
      el.innerText=cls.texto;
    }
  });
}

/* FOTOS COM COMPRESSÃO */
function salvarFoto(tipo,src,nomeAluno,dataAval){
  if(!src){ notifMsg('⚠️ Nenhuma foto para salvar!'); return; }
  const a=document.createElement('a');
  a.href=src; a.download=`${nomeAluno}_${dataAval}_${tipo}.jpg`; a.click();
  notifMsg(`📸 Foto ${tipo} salva!`);
}

function apagarFoto(alunoId,avId,tipo){
  backupEstado();
  const aluno=alunos.find(a=>a.id===alunoId);
  if(!aluno) return;
  const av=aluno.avaliacoes.find(a=>a.id===avId);
  if(!av) return;
  const campo=`foto${tipo.toUpperCase()}`;
  av[campo]=null;
  salvarDados();
  atualizarFotoBox(alunoId,avId,tipo);
  notifMsg(`🗑️ Foto ${tipo==='f'?'Frontal':tipo==='l'?'Lateral':'Dorsal'} apagada!`);
}

async function carregarFoto(alunoId,avId,tipo,input){
  const file=input.files[0];
  if(!file){ notifMsg('⚠️ Nenhum arquivo selecionado'); return; }
  if(!file.type.startsWith('image/')){ notifMsg('❌ Selecione uma imagem válida'); return; }
  notifMsg('📸 Comprimindo e carregando foto...');
  try {
    const imagemComprimida = await comprimirImagem(file, 800, 800, 0.7);
    backupEstado();
    const aluno=alunos.find(a=>a.id===alunoId);
    if(!aluno) return;
    const av=aluno.avaliacoes.find(a=>a.id===avId);
    if(!av) return;
    av[`foto${tipo.toUpperCase()}`]=imagemComprimida;
    salvarDados();
    atualizarFotoBox(alunoId,avId,tipo);
    notifMsg(`✅ Foto ${tipo==='f'?'Frontal':tipo==='l'?'Lateral':'Dorsal'} carregada!`);
  } catch(erro) {
    notifMsg('❌ Erro ao processar a imagem. Tente novamente.');
  }
}

function atualizarFotoBox(alunoId,avId,tipo){
  const aluno=alunos.find(a=>a.id===alunoId);
  if(!aluno) return;
  const av=aluno.avaliacoes.find(a=>a.id===avId);
  if(!av) return;
  const boxId=`fotobox-${alunoId}-${tipo}-${avId}`;
  const box=document.getElementById(boxId);
  if(!box) return;
  const src=av[`foto${tipo.toUpperCase()}`];
  const imgEl=box.querySelector('img');
  const btnArea=box.querySelector('.foto-buttons');
  const label=tipo==='f'?'Frontal':tipo==='l'?'Lateral':'Dorsal';
  const nomeAluno=aluno.nome;
  const dataAval=av.data||'';
  if(src){
    imgEl.src=src; imgEl.style.display='block';
    btnArea.innerHTML=`
      <button class="btn-salvar-foto" onclick="event.stopPropagation();salvarFoto('${label}',alunos.find(a=>a.id===${alunoId}).avaliacoes.find(v=>v.id===${avId}).foto${tipo.toUpperCase()},'${escapeHtml(nomeAluno)}','${escapeHtml(dataAval)}')">💾 Salvar</button>
      <button class="btn-apagar-foto" onclick="event.stopPropagation();apagarFoto(${alunoId},${avId},'${tipo}')">🗑️ Apagar</button>`;
  } else {
    imgEl.src=''; imgEl.style.display='none';
    btnArea.innerHTML='';
  }
}

/* RENDERIZA O GAUGE NO ESTILO "APP DE BALANÇA" (barra colorida + marcador + análise) */
function renderizarGauge(metricKey, valor, sexo, idadeReal, label){
  const v=pf(valor);
  if(isNaN(v)||valor===''||valor===undefined||valor===null){
    return `<div class="gauge-card"><small>⚠️ Preencha o campo "${label}" para ver a análise.</small></div>`;
  }
  if(metricKey==='idademetabolica'){
    const idadeR=pf(idadeReal);
    let msg='Idade metabólica calculada a partir do seu percentual de gordura corporal.', cor='#2196F3';
    if(!isNaN(idadeR)){
      if(v<idadeR-1){ msg='Sua composição corporal indica uma idade metabólica menor que a idade real 🎉'; cor='#4CAF50'; }
      else if(v>idadeR+1){ msg='Sua composição corporal indica uma idade metabólica maior que a idade real. Há espaço pra evoluir!'; cor='#F44336'; }
      else { msg='Sua idade metabólica está bem próxima da idade real.'; cor='#2196F3'; }
    }
    return `<div class="gauge-card">
      <div class="gauge-title">Idade Metabólica: <strong>${v} anos</strong>${!isNaN(idadeR)?` (idade real: ${idadeR} anos)`:''}</div>
      <div style="background:${cor};color:#fff;padding:8px 12px;border-radius:8px;font-weight:700;font-size:9pt;margin:8px 0">${msg}</div>
      <div class="gauge-desc"><strong>Análise de indicadores</strong><p>${REF_DATA.idademetabolica.texto}</p></div>
    </div>`;
  }
  const def=REF_DATA[metricKey];
  if(!def) return '';
  const zonas=def.zonas(sexo);
  const totalMin=zonas[0].min, totalMax=zonas[zonas.length-1].max;
  const pos=Math.max(0,Math.min(100,((v-totalMin)/(totalMax-totalMin))*100));
  const barras=zonas.map(z=>`<div style="flex:${z.max-z.min};background:${z.color}"></div>`).join('');
  const labels=zonas.map(z=>`<span style="flex:${z.max-z.min}">${z.label}</span>`).join('');
  return `<div class="gauge-card">
    <div class="gauge-title">${label}: <strong>${valor}</strong></div>
    <div class="gauge-bar">${barras}<div class="gauge-marker" style="left:${pos}%"></div></div>
    <div class="gauge-labels-row">${labels}</div>
    <div class="gauge-desc"><strong>Análise de indicadores</strong><p>${def.texto}</p></div>
  </div>`;
}

function toggleMetricGauge(panelId, metricKey, valor, sexo, idadeReal, label){
  const panel=document.getElementById(panelId);
  if(!panel) return;
  if(panel.classList.contains('show') && panel.dataset.metric===metricKey){
    panel.classList.remove('show');
    panel.dataset.metric='';
    return;
  }
  panel.innerHTML=renderizarGauge(metricKey,valor,sexo,idadeReal,label);
  panel.dataset.metric=metricKey;
  panel.classList.add('show');
  setTimeout(()=>panel.scrollIntoView({behavior:'smooth',block:'nearest'}),50);
}

/* Igual ao toggleMetricGauge, mas lê o valor e a idade direto dos campos no momento do clique
   (evita mostrar dados desatualizados quando o campo foi editado sem reabrir o card do aluno) */
function toggleMetricGaugeLive(panelId, metricKey, valorInputId, sexo, idadeInputId, label){
  const valorEl=document.getElementById(valorInputId);
  const idadeEl=document.getElementById(idadeInputId);
  const valor=valorEl?valorEl.value:'';
  const idadeReal=idadeEl?idadeEl.value:'';
  toggleMetricGauge(panelId, metricKey, valor, sexo, idadeReal, label);
}

    doc.setFontSize(10); doc.setFont('helvetica','bold'); doc.setTextColor(230,57,57);
    doc.text('RELATÓRIO POSTURAL',195,25,{align:'right'});

    let y=58;
    const temF=!!av.fotoF, temL=!!av.fotoL, temD=!!av.fotoD;
    if(temF||temL||temD){
      doc.setFillColor(230,57,57); doc.rect(14,y-3,3,5,'F');
      doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(26,26,26);
      doc.text('REGISTRO FOTOGRÁFICO',20,y);
      y+=8;
      const fW=56,fH=74,gap=5;
      const qtd=(temF?1:0)+(temL?1:0)+(temD?1:0);
      let fx=(210-(qtd*(fW+gap)-gap))/2;
      const drawF=async(src,label)=>{
        doc.setFillColor(245,245,245); doc.roundedRect(fx,y,fW,fH+9,3,3,'F');
        doc.setDrawColor(200,200,200); doc.setLineWidth(0.5); doc.roundedRect(fx,y,fW,fH+9,3,3,'S');
        try{
          const d=await getImgDataURL(src);
          if(d) doc.addImage(d,'JPEG',fx+1.5,y+1.5,fW-3,fH-3,undefined,'FAST');
        }catch(e){}
        doc.setFillColor(26,26,26); doc.rect(fx,y+fH,fW,9,'F');
        doc.setFillColor(230,57,57); doc.rect(fx,y+fH,4,9,'F');
        doc.setFont('helvetica','bold'); doc.setFontSize(6.5); doc.setTextColor(255,255,255);
        doc.text(label,fx+fW/2,y+fH+6,{align:'center'});
        fx+=fW+gap;
      };
      if(temF) await drawF(av.fotoF,'FRONTAL');
      if(temL) await drawF(av.fotoL,'LATERAL');
      if(temD) await drawF(av.fotoD,'DORSAL');
      y+=fH+9+12;
    }

    if(av.resumo&&av.resumo.trim()){
      doc.setFillColor(230,57,57); doc.rect(14,y-3,3,5,'F');
      doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(26,26,26);
      doc.text('ANÁLISE POSTURAL',20,y); y+=8;
      const resumoLines=doc.splitTextToSize(av.resumo,170);
      const boxH=resumoLines.length*5+10;
      doc.setFillColor(255,248,248); doc.roundedRect(14,y-2,182,boxH,3,3,'F');
      doc.setDrawColor(230,57,57); doc.setLineWidth(0.5); doc.roundedRect(14,y-2,182,boxH,3,3,'S');
      doc.setFillColor(230,57,57); doc.rect(14,y-2,4,boxH,'F');
      doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(60,60,70);
      doc.text(resumoLines,22,y+4);
    }

    const pH=297;
    doc.setFillColor(18,18,26); doc.rect(0,pH-16,210,16,'F');
    doc.setFillColor(230,57,57); doc.rect(0,pH-16,4,16,'F');
    doc.setFont('helvetica','bold'); doc.setFontSize(7); doc.setTextColor(255,255,255);
    doc.text('Caio Macêdo',12,pH-8);
    doc.setFontSize(5.5); doc.setTextColor(170,170,180);
    doc.text('CREF 007854-G/PI • @caiomacedo.personal • (86) 98879-6410',12,pH-3.5);
    doc.setTextColor(130,130,140);
    doc.text(`Pág. ${i+1} de ${aluno.avaliacoes.length}`,200,pH-8,{align:'right'});
  }
  doc.save(`Postural_${aluno.nome.replace(/\s+/g,'_')}.pdf`);
  notifMsg('✅ PDF Postural gerado!');
}

function getImgDataURL(src){
  return new Promise((resolve)=>{
    if(!src){ resolve(null); return; }
    const img=new Image();
    img.crossOrigin='Anonymous';
    img.onload=()=>{
      const canvas=document.createElement('canvas');
      canvas.width=img.width; canvas.height=img.height;
      canvas.getContext('2d').drawImage(img,0,0);
      resolve(canvas.toDataURL('image/jpeg',0.8));
    };
    img.onerror=()=>resolve(null);
    img.src=src;
  });
}

/* ORDENAÇÃO E FILTRAGEM */
function ordenarAlunos(){
  if (avaliacaoEmbedId !== null) {
    renderizarAlunos(alunos.filter(a => a.id === avaliacaoEmbedId));
    return;
  }
  currentOrdem = document.getElementById('ordemAluno').value;
  currentBusca = document.getElementById('buscaAluno').value.toLowerCase();
  let alunosFiltrados = alunos.filter(a => a.nome.toLowerCase().includes(currentBusca));
  switch(currentOrdem){
    case 'nome': alunosFiltrados.sort((a,b)=>a.nome.localeCompare(b.nome)); break;
    case 'nome_desc': alunosFiltrados.sort((a,b)=>b.nome.localeCompare(a.nome)); break;
    case 'data_avaliacao':
      alunosFiltrados.sort((a,b)=>{
        const dA=getUltimaDataAvaliacao(a), dB=getUltimaDataAvaliacao(b);
        if(!dA&&!dB) return 0; if(!dA) return 1; if(!dB) return -1;
        return new Date(dB.split('/').reverse().join('-'))-new Date(dA.split('/').reverse().join('-'));
      }); break;
  }
  renderizarAlunos(alunosFiltrados);
  const bannerEl=document.getElementById('bannerRenovacao');
  if(bannerEl){
    const itens=getAlunosComPendencias();
    renderizarBannerRenovacoes(itens);
  }
}

function filtrarAlunos(){ ordenarAlunos(); }

const avaliacaoParams = new URLSearchParams(location.search);
function abrirAlunoDoTreino() {
  const studentId = avaliacaoParams.get('treinoStudentId');
  if (!studentId) return;
  try {
    const student = AvaliacaoTreinoSync.read('treinoAlunos').find(a => a.student_id === studentId);
    if (!student) throw Error('Aluno não encontrado neste navegador. Abra a avaliação pelo Treino36.');
    let record = alunos.find(a => AvaliacaoTreinoSync.isLinked(a, studentId));
    if (!record && alunos.length && avaliacaoParams.get('novoCadastro') !== '1') throw Error('Confirme no Treino36 qual pessoa corresponde a este treino antes de sincronizar.');
    if (!record) {
      record = {id:Date.now(), nome:student.nome, sexo:'M', avaliacoes:[]};
      AvaliacaoTreinoSync.fromFicha(student, record, student.infoRelevante || (student.infoGuias || [])[0] || {});
      alunos.push(record);
    }
    AvaliacaoTreinoSync.link(record, studentId);
    avaliacaoEmbedId = record.id;
    alunoAtivoId = record.id;
    salvarDados();
    filtrarAlunos();
    const latest = (record.avaliacoes || []).slice(-1)[0];
    if (latest) document.getElementById(`av-item-${latest.id}`)?.classList.add('expanded');
  } catch (e) {
    document.getElementById('alunosList').textContent = e.message;
  }
}
if (['treino36','treino36-library'].includes(avaliacaoParams.get('embed'))) {
  document.documentElement.classList.add('avaliacao-embed');
  const style = document.createElement('style');
  style.textContent = '.avaliacao-embed .page-header,.avaliacao-embed .controles-header,.avaliacao-embed #bannerRenovacao,.avaliacao-embed .btn-topo{display:none}.avaliacao-embed body{padding:8px}.avaliacao-embed .alunos-grid{display:block}';
  if (avaliacaoParams.get('embed') === 'treino36-library') style.textContent = '.avaliacao-embed .page-header,.avaliacao-embed .btn-topo{display:none}.avaliacao-embed body{padding:8px}';
  document.head.appendChild(style);
}
window.addEventListener('storage', function (event) {
  if (event.key !== AvaliacaoTreinoSync.key) return;
  try {
    // Os valores já são persistidos; cancelar apenas a atualização visual pendente.
    if (timeoutDobras) { clearTimeout(timeoutDobras); timeoutDobras = null; }
    alunos = AvaliacaoTreinoSync.read(AvaliacaoTreinoSync.key);
    alunos.forEach(a => (a.avaliacoes || []).forEach(av => calcularIMCeDobras(a, av.id)));
    salvarDados();
    filtrarAlunos();
  } catch (e) { notifMsg('⚠️ ' + e.message); }
});
window.addEventListener('pagehide', function () {
  if (timeoutDobras) { clearTimeout(timeoutDobras); timeoutDobras = null; salvarDados(); }
});

/* INICIALIZAÇÃO */
document.getElementById('btnNovoAluno').addEventListener('click',function(e){
  e.preventDefault();
  novoAluno();
});

document.getElementById('buscaAluno').addEventListener('input', function(){
  currentBusca = this.value;
  ordenarAlunos();
});
document.getElementById('ordemAluno').addEventListener('change', function(){
  currentOrdem = this.value;
  ordenarAlunos();
});

carregarDados();
abrirAlunoDoTreino();
</script>
